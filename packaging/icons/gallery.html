<title>PDF Editor Icons</title>
<style>
  :root { --bg:#f5f6f8; --card:#ffffff; --ink:#1f2d3d; --muted:#5b6b7b; --line:#e3e7ec; }
  :root:not([data-theme="light"]) { }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#151b22; --card:#1e2732; --ink:#eaf0f6; --muted:#9fb0c0; --line:#2b3745; }
  }
  :root[data-theme="dark"] { --bg:#151b22; --card:#1e2732; --ink:#eaf0f6; --muted:#9fb0c0; --line:#2b3745; }
  body { margin:0; padding:28px; background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:18px; }
  .card { margin:0; background:var(--card); border:1px solid var(--line); border-radius:16px;
           padding:18px; text-align:center; }
  .icon svg { width:120px; height:120px; }
  figcaption { margin-top:12px; font-size:13px; color:var(--muted); }
</style>
<h1>App icon options</h1>
<p class="lead">Six designs for the PDF Viewer &amp; Editor. Tell me a number and I'll set it as the app icon.</p>
